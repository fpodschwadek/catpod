name: Docker Image Test Build

on:
  push:
    branches: [ "main" ]
    # Only run when something that goes into the image, or the tests
    # themselves, changed. Keep in sync with the pull_request list below.
    paths:
      - '.dockerignore'
      - 'ansible.cfg'
      - 'catpod.yml'
      - 'docker.yml'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'requirements.txt'
      - 'requirements.yml'
      - 'test*.yml'
      - '.github/workflows/docker-image-build-test.yml'
  # Test pull requests before they're merged. Safe for PRs from forks: this
  # workflow uses no secrets and only gets a read-only token (never switch to
  # pull_request_target, which runs with the base repository's permissions).
  pull_request:
    branches: [ "main" ]
    paths:
      - '.dockerignore'
      - 'ansible.cfg'
      - 'catpod.yml'
      - 'docker.yml'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'requirements.txt'
      - 'requirements.yml'
      - 'test*.yml'
      - '.github/workflows/docker-image-build-test.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build the Docker image
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./Dockerfile
        push: false
        load: true
        tags: catpod-test:${{ github.run_number }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify binaries exist
      run: |
        IMAGE="catpod-test:${{ github.run_number }}"
        CONTAINER_ID=$(docker run -d --entrypoint /bin/ash "$IMAGE" -c "sleep 30")

        FILES_TO_CHECK=("/usr/bin/ansible-galaxy" "/usr/bin/ansible-vault" "/usr/bin/ansible-playbook")
        MISSING_FILES=()

        for FILE in "${FILES_TO_CHECK[@]}"; do
          echo "Checking for $FILE..."
          if ! docker exec "$CONTAINER_ID" [ -f "$FILE" ]; then
            MISSING_FILES+=("$FILE")
            echo "❌ File $FILE not found"
          else
            echo "✅ File $FILE exists"
          fi
        done

        docker stop "$CONTAINER_ID" > /dev/null
        docker rm "$CONTAINER_ID" > /dev/null

        if [ ${#MISSING_FILES[@]} -ne 0 ]; then
          echo "The following required files are missing: ${MISSING_FILES[*]}"
          exit 1
        fi

    - name: Test playbooks run as non-root user
      run: |
        IMAGE="catpod-test:${{ github.run_number }}"

        # Go through the real entrypoint, which starts as root and switches to catpod.
        OUTPUT=$(docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "${{ github.workspace }}/test-user.yml:/tmp/test-user.yml" \
          "$IMAGE" /tmp/test-user.yml 2>&1)
        echo "$OUTPUT"

        if ! echo "$OUTPUT" | grep -q "uid=10999(catpod)"; then
          echo "❌ Expected uid=10999(catpod)"
          exit 1
        fi
        echo "✅ Running as catpod (UID 10999)"

    - name: Test Ansible configuration
      run: |
        IMAGE="catpod-test:${{ github.run_number }}"
        OUTPUT=$(docker run --rm --entrypoint /bin/ash "$IMAGE" -c "ansible-config dump --only-changed")
        echo "$OUTPUT"

        FAILED=0
        for EXPECTED in "DEFAULT_FORKS" "DEFAULT_GATHERING" "ANSIBLE_PIPELINING"; do
          if echo "$OUTPUT" | grep -q "$EXPECTED"; then
            echo "✅ $EXPECTED is set"
          else
            echo "❌ $EXPECTED not found in active config"
            FAILED=1
          fi
        done

        if [ "$FAILED" -eq 1 ]; then
          exit 1
        fi

    - name: Test playbook mode
      run: |
        IMAGE="catpod-test:${{ github.run_number }}"

        # Remove any leftover hello-world container from previous runs
        docker rm -f hello-world 2>/dev/null || true

        # No --group-add: the entrypoint grants socket access automatically.
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "${{ github.workspace }}/test.yml:/tmp/test.yml" \
          "$IMAGE" /tmp/test.yml

        if docker ps -a --format '{{.Names}}' | grep -q "^hello-world$"; then
          echo "✅ Playbook created the hello-world container"
        else
          echo "❌ hello-world container not found"
          exit 1
        fi

        # Clean up
        docker rm -f hello-world 2>/dev/null || true

    - name: Test vault mode
      run: |
        IMAGE="catpod-test:${{ github.run_number }}"
        OUTPUT=$(echo 'testpassword' | docker run --rm -i "$IMAGE" \
          vault encrypt_string 'secretvalue' --name 'myvar' --vault-password-file /dev/stdin)
        echo "$OUTPUT"

        # shellcheck disable=SC2016 # $ANSIBLE_VAULT is meant literally
        if echo "$OUTPUT" | grep -q '\$ANSIBLE_VAULT'; then
          echo "✅ Vault encryption produced valid output"
        else
          echo "❌ Expected \$ANSIBLE_VAULT in output"
          exit 1
        fi

    - name: Test galaxy mode
      run: |
        IMAGE="catpod-test:${{ github.run_number }}"
        OUTPUT=$(docker run --rm "$IMAGE" galaxy collection list)
        echo "$OUTPUT"

        FAILED=0
        for COLLECTION in "community.docker" "community.mysql"; do
          if echo "$OUTPUT" | grep -q "$COLLECTION"; then
            echo "✅ Collection $COLLECTION is installed"
          else
            echo "❌ Collection $COLLECTION not found"
            FAILED=1
          fi
        done

        if [ "$FAILED" -eq 1 ]; then
          exit 1
        fi

    - name: Test socket warning when not mounted
      run: |
        IMAGE="catpod-test:${{ github.run_number }}"

        # Run without Docker socket; use a playbook that doesn't need Docker
        # so the entrypoint warning fires but ansible-playbook can still run.
        STDERR=$(docker run --rm "$IMAGE" --version 2>&1 >/dev/null || true)
        echo "$STDERR"

        if echo "$STDERR" | grep -q "Docker socket not found"; then
          echo "✅ Socket-not-mounted warning displayed"
        else
          echo "❌ Expected 'Docker socket not found' warning on stderr"
          exit 1
        fi

    - name: Test socket permission error with overridden user
      run: |
        IMAGE="catpod-test:${{ github.run_number }}"

        # With --user, the entrypoint cannot grant socket access, so the check must fire.
        STDERR=$(docker run --rm \
          --user 10999 \
          -v /var/run/docker.sock:/var/run/docker.sock \
          "$IMAGE" --version 2>&1 || true)
        echo "$STDERR"

        if echo "$STDERR" | grep -q "Cannot access Docker socket"; then
          echo "✅ Socket permission error displayed"
        else
          # On some CI runners the docker socket is world-readable,
          # so the permission check may pass. That's acceptable.
          echo "⚠️  Permission error not triggered (socket may be world-accessible on this runner)"
        fi

    - name: Test CATPOD_INVENTORY_GROUP substitution
      run: |
        IMAGE="catpod-test:${{ github.run_number }}"

        # Run with the real entrypoint so the sed substitution executes.
        # --version makes ansible-playbook exit quickly.
        docker run \
          -e CATPOD_INVENTORY_GROUP=myproject \
          --name catpod-test-group \
          "$IMAGE" --version > /dev/null 2>&1 || true

        # Extract the file from the stopped container
        OUTPUT=$(docker cp catpod-test-group:/etc/ansible/docker.yml - | tar -xO)
        echo "$OUTPUT"

        docker rm catpod-test-group > /dev/null

        if echo "$OUTPUT" | grep -q "myproject"; then
          echo "✅ Inventory group substituted to 'myproject'"
        else
          echo "❌ Expected 'myproject' in docker.yml"
          exit 1
        fi

        if echo "$OUTPUT" | grep -q "kittens"; then
          echo "❌ Default group name 'kittens' still present"
          exit 1
        else
          echo "✅ Default group name 'kittens' replaced"
        fi

    - name: Test CATPOD_INVENTORY_GROUP rejects invalid names
      run: |
        IMAGE="catpod-test:${{ github.run_number }}"

        STDERR=$(docker run --rm \
          -e 'CATPOD_INVENTORY_GROUP=bad/name' \
          "$IMAGE" --version 2>&1 || true)
        echo "$STDERR"

        if echo "$STDERR" | grep -q "may only contain letters, digits and underscores"; then
          echo "✅ Invalid group name rejected"
        else
          echo "❌ Expected invalid CATPOD_INVENTORY_GROUP to be rejected"
          exit 1
        fi

    - name: Test exit codes are passed through
      run: |
        IMAGE="catpod-test:${{ github.run_number }}"
        FAILED=0

        EXIT=0
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "${{ github.workspace }}/test-user.yml:/tmp/test-user.yml" \
          "$IMAGE" /tmp/test-user.yml > /dev/null 2>&1 || EXIT=$?

        if [ "$EXIT" -eq 0 ]; then
          echo "✅ Successful playbook exits with 0"
        else
          echo "❌ Successful playbook exited with $EXIT"
          FAILED=1
        fi

        EXIT=0
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "${{ github.workspace }}/test-fail.yml:/tmp/test-fail.yml" \
          "$IMAGE" /tmp/test-fail.yml > /dev/null 2>&1 || EXIT=$?

        if [ "$EXIT" -ne 0 ]; then
          echo "✅ Failing playbook exits with $EXIT"
        else
          echo "❌ Failing playbook exited with 0"
          FAILED=1
        fi

        EXIT=0
        docker run --rm "$IMAGE" vault view /nonexistent > /dev/null 2>&1 || EXIT=$?

        if [ "$EXIT" -ne 0 ]; then
          echo "✅ Failing vault command exits with $EXIT"
        else
          echo "❌ Failing vault command exited with 0"
          FAILED=1
        fi

        if [ "$FAILED" -eq 1 ]; then
          exit 1
        fi

    - name: Test docker stop terminates promptly
      run: |
        IMAGE="catpod-test:${{ github.run_number }}"

        docker run -d \
          --name catpod-test-stop \
          -v "${{ github.workspace }}/test-sleep.yml:/tmp/test-sleep.yml" \
          "$IMAGE" /tmp/test-sleep.yml > /dev/null

        # Wait until the long-running task has started.
        for _ in $(seq 30); do
          docker logs catpod-test-stop 2>&1 | grep -q "TASK \[Sleep" && break
          sleep 1
        done

        START=$(date +%s)
        docker stop catpod-test-stop > /dev/null
        DURATION=$(( $(date +%s) - START ))
        docker rm catpod-test-stop > /dev/null

        # Without signal forwarding, Docker waits its full 10 s timeout before killing.
        if [ "$DURATION" -lt 5 ]; then
          echo "✅ Container stopped after ${DURATION}s"
        else
          echo "❌ Container took ${DURATION}s to stop (signals not forwarded?)"
          exit 1
        fi

    - name: Test no sensitive group-owned files
      run: |
        IMAGE="catpod-test:${{ github.run_number }}"
        FAILED=0

        # catpod joins whatever group owns the host's Docker socket, so no file in
        # the image may be accessible through another group (see entrypoint.sh).
        OUTPUT=$(docker run --rm --entrypoint /bin/ash "$IMAGE" -c \
          'find / -xdev ! -group 0 ! -group 10999 ! -path /etc/shadow ! -path /etc/shadow- 2>/dev/null')

        if [ -z "$OUTPUT" ]; then
          echo "✅ Only /etc/shadow is owned by another group"
        else
          echo "❌ Unexpected group-owned files: $OUTPUT"
          FAILED=1
        fi

        # Hashes start with "$" (e.g. "$6$..."); locked or disabled accounts have "!" or "*".
        # shellcheck disable=SC2016 # $ is meant literally
        OUTPUT=$(docker run --rm --entrypoint /bin/ash "$IMAGE" -c \
          'cut -d: -f1,2 /etc/shadow | grep -F ":\$" | cut -d: -f1')

        if [ -z "$OUTPUT" ]; then
          echo "✅ /etc/shadow contains no password hashes"
        else
          echo "❌ Password hashes in /etc/shadow for: $OUTPUT"
          FAILED=1
        fi

        if [ "$FAILED" -eq 1 ]; then
          exit 1
        fi

    - name: Test runs with the documented hardening options
      run: |
        IMAGE="catpod-test:${{ github.run_number }}"
        FAILED=0

        # Must match "Optional Hardening" in docs/how-to-use.md and the README.
        HARDENING="--cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add KILL --security-opt no-new-privileges"

        # shellcheck disable=SC2086 # word splitting of $HARDENING is intended
        OUTPUT=$(docker run --rm $HARDENING \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "${{ github.workspace }}/test-user.yml:/tmp/test-user.yml" \
          "$IMAGE" /tmp/test-user.yml 2>&1)

        if echo "$OUTPUT" | grep -q "uid=10999(catpod)"; then
          echo "✅ Playbook runs as catpod"
        else
          echo "❌ Playbook failed with hardening options: $OUTPUT"
          FAILED=1
        fi

        # shellcheck disable=SC2086
        docker run -d $HARDENING \
          --name catpod-test-hardened \
          -v "${{ github.workspace }}/test-sleep.yml:/tmp/test-sleep.yml" \
          "$IMAGE" /tmp/test-sleep.yml > /dev/null

        for _ in $(seq 30); do
          docker logs catpod-test-hardened 2>&1 | grep -q "TASK \[Sleep" && break
          sleep 1
        done

        docker stop catpod-test-hardened > /dev/null
        EXIT=$(docker inspect catpod-test-hardened --format '{{.State.ExitCode}}')
        docker rm catpod-test-hardened > /dev/null

        # 143 = terminated by SIGTERM; tini exits with 1 if it can't forward signals.
        if [ "$EXIT" -eq 143 ]; then
          echo "✅ docker stop forwards SIGTERM (exit 143)"
        else
          echo "❌ docker stop exited with $EXIT (signal forwarding failed?)"
          FAILED=1
        fi

        if [ "$FAILED" -eq 1 ]; then
          exit 1
        fi

    - name: Test Docker Compose works
      run: |
        IMAGE="catpod-test:${{ github.run_number }}"

        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "${{ github.workspace }}/test-compose.yml:/tmp/test-compose.yml" \
          "$IMAGE" /tmp/test-compose.yml

        if [ -n "$(docker ps -aq --filter label=com.docker.compose.project=catpod-test-compose)" ]; then
          echo "❌ Compose containers left behind"
          exit 1
        fi
        echo "✅ Compose project started and removed via Ansible"

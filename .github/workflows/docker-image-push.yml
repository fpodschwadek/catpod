# Build the Docker image for every supported platform and push it to Docker
# Hub on every release, as one multi-platform tag (one separate image per
# platform, so users only download their own).
#
# Each platform builds in its own job and is tested before anything is pushed:
# the full test suite on natively built platforms, a smoke test on emulated
# ones. A final job combines the per-platform images into one tag.
# See https://docs.docker.com/build/ci/github-actions/multi-platform/
#
# It can also be run manually (workflow_dispatch) from any branch or tag:
# without "publish", it only builds and tests all platforms; with "publish",
# it also pushes the image under the given version. That allows (re-)publishing
# a version independently of where its git tag points, e.g. after a failed
# release build was fixed.
name: Docker Image Docker Hub Push

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to Docker Hub (otherwise only build and test)
        type: boolean
        default: false
      version:
        description: Version to publish as, e.g. 2.0.0 (required with "publish")
        type: string
        default: ''
      latest:
        description: Also tag as latest (with "publish"; ignored for pre-release versions like 2.1.0-rc.1)
        type: boolean
        default: true

permissions:
  contents: read

env:
  IMAGE: fpod/catpod

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Let every platform finish, so one failure doesn't hide others. A
      # release still needs all of them: the merge job only runs if every
      # build succeeded.
      fail-fast: false
      matrix:
        include:
          # Fully tested: built natively, full test suite.
          - platform: linux/amd64
            runner: ubuntu-24.04
            tests: full
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tests: full
          # Best effort: smoke-tested only. 386 runs natively on x64 runners,
          # the others are emulated with QEMU.
          - platform: linux/386
            runner: ubuntu-24.04
            tests: smoke
          - platform: linux/arm/v7
            runner: ubuntu-24.04
            tests: smoke
            emulated: true
          - platform: linux/arm/v6
            runner: ubuntu-24.04
            tests: smoke
            emulated: true
          - platform: linux/ppc64le
            runner: ubuntu-24.04
            tests: smoke
            emulated: true
          - platform: linux/s390x
            runner: ubuntu-24.04
            tests: smoke
            emulated: true
          - platform: linux/riscv64
            runner: ubuntu-24.04
            tests: smoke
            emulated: true
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check publish inputs
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "❌ Publishing needs a version like 2.0.0 or 2.1.0-rc.1, got: '$VERSION'"
            exit 1
          fi

      - name: Prepare
        run: |
          PLATFORM="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        if: matrix.emulated
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Same tag rules as in the merge job, so the version label is right.
      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}

      - name: Build image for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: catpod-test
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

      - name: Run full test suite
        if: matrix.tests == 'full'
        run: bash test.sh --no-build

      - name: Run smoke test
        if: matrix.tests == 'smoke'
        run: |
          PLATFORM="${{ matrix.platform }}"

          # Python, Ansible and the entrypoint start up.
          docker run --rm --platform "$PLATFORM" catpod-test --version

          # cryptography (compiled code) works.
          OUTPUT=$(echo 'testpassword' | docker run --rm -i --platform "$PLATFORM" catpod-test \
            vault encrypt_string 'secretvalue' --name 'myvar' --vault-password-file /dev/stdin)
          # shellcheck disable=SC2016 # $ANSIBLE_VAULT is meant literally
          echo "$OUTPUT" | grep -q '\$ANSIBLE_VAULT' || { echo "❌ Vault encryption failed"; exit 1; }

          # A playbook runs, as the non-root user.
          OUTPUT=$(docker run --rm --platform "$PLATFORM" \
            -v "${{ github.workspace }}/test-user.yml:/tmp/test-user.yml" \
            catpod-test /tmp/test-user.yml 2>&1)
          echo "$OUTPUT" | grep -q "uid=10999(catpod)" || { echo "$OUTPUT"; echo "❌ Playbook did not run as catpod"; exit 1; }

          echo "✅ Smoke test passed for $PLATFORM"

      - name: Log in to Docker Hub
        if: github.event_name == 'release' || inputs.publish
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      # Reuses the cache from the test build, so this doesn't rebuild.
      - name: Push image by digest
        if: github.event_name == 'release' || inputs.publish
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        if: github.event_name == 'release' || inputs.publish
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          DIGEST="${{ steps.push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name == 'release' || inputs.publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-platform tag
    if: github.event_name == 'release' || inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # The version comes from the git tag on releases and from the
          # "version" input on manual runs. `latest` is set for releases and
          # for manual runs with "latest" ticked, but never for pre-releases
          # (manual versions with a suffix such as -rc.1 count as such).
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ (github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && inputs.latest && !contains(inputs.version, '-')) }}

      - name: Create multi-platform tag
        working-directory: ${{ runner.temp }}/digests
        # Word splitting is intended: one "-t <tag>" pair per tag and one
        # argument per digest.
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"

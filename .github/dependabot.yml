# Proposes updates for the pinned base image, Python packages and GitHub
# Actions as pull requests. Merging one of them is the only way pinned
# versions change.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      # Ansible and its dependencies usually need to move together.
      python-packages:
        patterns:
          - "*"

  # Actions are pinned to commit SHAs; Dependabot updates the SHA and the
  # version comment next to it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
